name: Tests (e2e)

on:
  pull_request:

env:
  NODE_VERSION: 26.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tests (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          # audit is deliberate: `npx playwright install --with-deps` pulls browser
          # builds from Playwright's CDN and system packages via apt mirrors whose
          # hostnames vary by runner image; block mode would break the install
          egress-policy: audit
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            azure.archive.ubuntu.com:443
            cdn.playwright.dev:443
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            motd.ubuntu.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            packages.microsoft.com:443
            playwright.download.prss.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
      # allowed-endpoints: >
      #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # allowed-endpoints: >
      #   api.github.com:443
      #   nodejs.org:443
      #   objects.githubusercontent.com:443
      #   registry.npmjs.org:443
      #   release-assets.githubusercontent.com:443
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      # allowed-endpoints: >
      #   registry.npmjs.org:443
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      # allowed-endpoints: >
      #   azure.archive.ubuntu.com:443
      #   cdn.playwright.dev:443
      #   dl.google.com:443
      #   esm.ubuntu.com:443
      #   motd.ubuntu.com:443
      #   packages.microsoft.com:443
      #   playwright.download.prss.microsoft.com:443
      #   registry.npmjs.org:443
      #   storage.googleapis.com:443
      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium firefox webkit
      # allowed-endpoints: >
      #   cdn.playwright.dev:443
      #   playwright.download.prss.microsoft.com:443
      #   registry.npmjs.org:443
      #   storage.googleapis.com:443
      - name: Playwright e2e
        run: |
          npx playwright test
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
